[package]
name = "iima"
version = "0.9.4"
edition = "2021"

[lib]
name = "iima_lib"
# This repository only ships the macOS desktop binaries. The executable links
# this crate as an rlib; staticlib/cdylib outputs are mobile embedding artifacts
# that multiply large debug outputs without being consumed by the package gate.
crate-type = ["rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]
macos-cli = []

[[bin]]
name = "iina-cli"
path = "src/bin/iina-cli.rs"
required-features = ["macos-cli"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
md-5 = "0.10.6"
sha2 = "0.10.9"
plist = "1.9.0"
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

# Keep useful line-level information for project code, but do not emit full
# debug symbols for every third-party dependency. Tests are batch verification
# work, so disabling their incremental cache avoids retaining many stale copies
# of the large iima_lib compilation graph.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0
